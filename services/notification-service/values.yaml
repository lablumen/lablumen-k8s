# notification-service — identity (env-invariant). Background SQS consumer (no public ingress).
# Needs AWS (SQS + SES) → IRSA.
name: notification-service

image:
  repository: lablumen/notification-service   # registry host comes from global-values.yaml

# Config wiring: AWS config from SSM mapped to the app's exact env-var names.
externalSecret:
  ssmData:
    - { secretKey: AWS_REGION, remoteKey: /lablumen/config/region }
    - { secretKey: NOTIFICATIONS_QUEUE_URL, remoteKey: /lablumen/config/sqs-url }
    - { secretKey: SES_SENDER_EMAIL, remoteKey: /lablumen/config/ses-sender }

serviceAccount:
  create: false
  name: notification-service

# No ingress — consumes SQS, not HTTP-fronted.
ingress:
  enabled: false

# CPU request bumped from the legacy 50m to meet the rubric floor of >= 100m.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
