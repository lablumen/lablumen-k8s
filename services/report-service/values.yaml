# report-service — identity (env-invariant). Needs AWS (S3 + Bedrock) → IRSA.
name: report-service

image:
  repository: lablumen/report-service   # registry host comes from global-values.yaml

# Config wiring: AWS config from SSM mapped to the app's exact env-var names.
externalSecret:
  ssmData:
    - { secretKey: AWS_REGION, remoteKey: /lablumen/config/region }
    - { secretKey: COGNITO_USER_POOL_ID, remoteKey: /lablumen/config/cognito-user-pool-id }
    - { secretKey: COGNITO_APP_CLIENT_ID, remoteKey: /lablumen/config/cognito-app-client-id }
    - { secretKey: REPORTS_S3_BUCKET, remoteKey: /lablumen/config/reports-bucket }
    - { secretKey: BEDROCK_EMBED_MODEL_ID, remoteKey: /lablumen/config/bedrock-embed-model }
    - { secretKey: BEDROCK_TEXT_MODEL_ID, remoteKey: /lablumen/config/bedrock-text-model }
    - { secretKey: PRESIGNED_URL_TTL_SECONDS, remoteKey: /lablumen/config/presigned-url-ttl }
    - { secretKey: BEDROCK_CROSS_ACCOUNT_ROLE_ARN, remoteKey: /lablumen/config/bedrock-cross-account-role-arn }

# prod: consume the Terraform-created IRSA ServiceAccount (create:false). dev overrides to create:true.
serviceAccount:
  create: false
  name: report-service

ingress:
  enabled: true
  path: /api/v1/reports
  pathType: Prefix
  groupOrder: 10           # specific sub-path — evaluated BEFORE appointment's /api/v1
  healthcheckPath: /healthz
