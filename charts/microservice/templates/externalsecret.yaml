{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.secretName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "microservice.secretName" . }}
    creationPolicy: Owner
  data:
    # Sensitive values from Secrets Manager (default secretStoreRef).
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
    # Non-sensitive config from SSM Parameter Store, each mapped to the EXACT env-var name the app
    # expects (sourceRef overrides the store to aws-parameter-store; scoped GetParameter).
    {{- range .Values.externalSecret.ssmData }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
      sourceRef:
        storeRef:
          name: {{ $.Values.externalSecret.parameterStore }}
          kind: ClusterSecretStore
    {{- end }}
{{- end }}
