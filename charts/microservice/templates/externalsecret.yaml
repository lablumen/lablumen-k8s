{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.secretName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "microservice.secretName" . }}
    creationPolicy: Owner
  {{- with .Values.externalSecret.data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- range . }}
    - find:
        path: {{ .path | quote }}
        # ESO requires a find operator (name/tags); `path` only scopes it. Match all params under path.
        name:
          regexp: ".*"
      sourceRef:
        storeRef:
          name: {{ $.Values.externalSecret.parameterStore }}
          kind: ClusterSecretStore
    {{- end }}
  {{- end }}
{{- end }}
