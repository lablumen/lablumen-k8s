# AppProject guardrails for the whole LabLumen platform (addons + config + microservices).
# Replaces the previous use of `project: default`. Synced first (wave -1) so child Applications that
# reference `project: lablumen` resolve cleanly.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lablumen
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: LabLumen platform — addons, cluster config, and microservices (dev + prod).

  # Only these repositories may be deployed from.
  sourceRepos:
    - https://github.com/lablumen/lablumen-k8s.git
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://aws.github.io/eks-charts
    - public.ecr.aws/karpenter
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://kubernetes-sigs.github.io/external-dns/
    - https://prometheus-community.github.io/helm-charts

  # Only these namespaces on the in-cluster server may be targeted.
  destinations:
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: kube-system }
    - { server: https://kubernetes.default.svc, namespace: kube-node-lease }   # karpenter lease Role/RoleBinding
    - { server: https://kubernetes.default.svc, namespace: external-secrets }
    - { server: https://kubernetes.default.svc, namespace: lablumen }
    - { server: https://kubernetes.default.svc, namespace: lablumen-dev }
    - { server: https://kubernetes.default.svc, namespace: monitoring }      # kube-prometheus-stack

  # Cluster-scoped resources the addons legitimately need (curated, not "*/*"). Tighten further if a
  # given addon version stops needing one of these.
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: "*" }
    - { group: apiregistration.k8s.io, kind: APIService }
    - { group: external-secrets.io, kind: ClusterSecretStore }
    - { group: networking.k8s.io, kind: IngressClass }
    - { group: elbv2.k8s.aws, kind: "*" }
    - { group: karpenter.sh, kind: "*" }
    - { group: karpenter.k8s.aws, kind: "*" }

  # Namespaced resources: allow all within the whitelisted namespaces.
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
