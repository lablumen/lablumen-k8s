# dev microservices. Multi-source: the shared chart (charts/microservice or charts/redis) combined
# with each service's value overlays via the $values ref. App names suffixed -dev; namespace
# lablumen-dev. Generated apps run at sync-wave 2 (after addons + ClusterSecretStores).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { name: appointment-service, chart: charts/microservice }
          - { name: report-service,      chart: charts/microservice }
          - { name: notification-service, chart: charts/microservice }
          - { name: redis,               chart: charts/redis }
          - { name: frontend,            chart: charts/microservice }
  template:
    metadata:
      name: '{{.name}}-dev'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: lablumen
      sources:
        - repoURL: https://github.com/lablumen/lablumen-k8s.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/lablumen/lablumen-k8s.git
          targetRevision: main
          path: '{{.chart}}'
          helm:
            valueFiles:
              - $values/global-values.yaml
              - $values/services/{{.name}}/values.yaml
              - $values/services/{{.name}}/values-dev.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: lablumen-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
