# Creates the monitoring namespace + the Grafana admin ExternalSecret at wave 1 (after the
# ClusterSecretStore, before the monitoring stack at wave 2) so grafana-admin exists when Grafana starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lablumen
  source:
    repoURL: https://github.com/lablumen/lablumen-k8s.git
    targetRevision: main
    path: platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
