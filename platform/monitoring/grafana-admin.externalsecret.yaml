# Grafana admin credentials, sourced from AWS Secrets Manager via ESO (same pattern as DATABASE_URL).
# The SM secret lablumen/app/grafana-admin holds JSON {"admin-user":..., "admin-password":...} (created
# by Terraform, hand-populated). ESO renders it into the grafana-admin Secret that the Grafana chart
# consumes via admin.existingSecret. Nothing secret lives in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: lablumen/app/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: lablumen/app/grafana-admin
        property: admin-password
