# EC2NodeClass — how Karpenter builds nodes (AMI, IAM role, subnets, security groups).
# Subnets + SG are discovered by the `karpenter.sh/discovery=lablumen-eks` tags that Terraform's EKS
# Karpenter submodule applied. `role` is the Terraform-created Karpenter node role — Karpenter manages
# its instance profile. NOTE: the role name carries a Terraform-generated suffix, so it is per-account
# (like global-values.yaml's registry); update it after a fresh `terraform apply` if it changes
# (`aws iam list-roles --query "Roles[?starts_with(RoleName,'Karpenter-lablumen-eks-')].RoleName"`).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "Karpenter-lablumen-eks-2026062413531375300000001f"
  amiSelectorTerms:
    - alias: al2023@latest          # AL2023 AMI matching the cluster's Kubernetes version
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: lablumen-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: lablumen-eks
