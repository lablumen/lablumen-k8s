# EC2NodeClass — how Karpenter builds nodes (AMI, IAM role, subnets, security groups).
# Subnets + SG are discovered by the `karpenter.sh/discovery=lablumen-eks` tags set by Terraform.
# The node role name is deterministic: Terraform sets node_iam_role_name = "KarpenterNodeRole-<cluster>"
# so this file never needs updating after a re-apply.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "KarpenterNodeRole-lablumen-eks"
  amiSelectorTerms:
    - alias: al2023@latest          # AL2023 AMI matching the cluster's Kubernetes version
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: lablumen-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: lablumen-eks
