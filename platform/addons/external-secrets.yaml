# External Secrets Operator. ServiceAccount is pre-created by Terraform (IRSA-annotated) as
# `lablumen-eso`; the chart only references it (create: false). Wave 0 so the CRDs + controller are
# ready before the ClusterSecretStore (wave 1) and app ExternalSecrets (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: lablumen
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          create: false
          name: lablumen-eso
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
