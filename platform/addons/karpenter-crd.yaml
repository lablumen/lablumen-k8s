# Karpenter CRDs. In Karpenter v1.x the CRDs ship in a SEPARATE chart (karpenter-crd), installed
# BEFORE the controller (wave -1) so the controller (wave 0) and NodePool/EC2NodeClass (wave 1) resolve.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: lablumen
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter-crd
    targetRevision: 1.0.6
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true     # Karpenter CRDs are large — avoid client-side apply annotation limit
