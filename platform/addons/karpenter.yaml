# Karpenter: dynamic node provisioning. IAM role / instance profile / interruption queue are
# created by terraform/modules/eks (karpenter submodule); the ServiceAccount is pre-created by
# Terraform (IRSA-annotated) and referenced here (create: false).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: lablumen
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.0.6
    helm:
      values: |
        settings:
          clusterName: lablumen-eks
          interruptionQueue: Karpenter-lablumen-eks   # matches Terraform karpenter_queue_name
        serviceAccount:
          create: false
          name: karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
