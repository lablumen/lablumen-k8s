# Cluster-scoped ESO stores. Auth is IRSA via the Terraform-created `lablumen-eso` ServiceAccount
# (jwt/web-identity). Synced by argocd/apps/platform-config.yaml at sync-wave 1 — after the ESO CRDs
# and controller (wave 0) exist, before app ExternalSecrets (wave 2).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: lablumen-eso
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: lablumen-eso
            namespace: external-secrets
